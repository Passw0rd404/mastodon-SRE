apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: mastodon
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-poolers
  namespace: mastodon
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: pooler
  podMetricsEndpoints:
    - port: metrics

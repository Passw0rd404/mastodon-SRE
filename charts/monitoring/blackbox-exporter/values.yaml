config:
  modules:
    dns_kubernetes:
      prober: dns
      timeout: 5s
      dns:
        query_name: kubernetes.default.svc.cluster.local
        query_type: A
        preferred_ip_protocol: ip4

serviceMonitor:
  enabled: true
  selfMonitor:
    enabled: true
  defaults:
    interval: 30s
    scrapeTimeout: 10s
    module: http_2xx

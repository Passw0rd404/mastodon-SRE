apiVersion: v1
kind: Secret
metadata:
  name: db-password
type: kubernetes.io/basic-auth
stringData:
  username: mastodon
  password: password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    nodeSelector:
      db: "true"
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: mastodon
      owner: mastodon
      secret:
        name: db-password
  storage:
    size: 5Gi
    storageClass: ""
    resizeInUseVolumes: true

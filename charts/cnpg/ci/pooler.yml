apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: mastodon-pooler-rw
  namespace: default
spec:
  cluster:
    name: postgres
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "50"
      reserve_pool_size: "10"
      reserve_pool_timeout: "3"
      server_idle_timeout: "600"
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: mastodon-pooler-ro
  namespace: default
spec:
  cluster:
    name: postgres
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "50"
      reserve_pool_size: "10"
      reserve_pool_timeout: "3"
      server_idle_timeout: "600"

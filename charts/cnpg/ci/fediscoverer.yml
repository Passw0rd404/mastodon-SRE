apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: fediscoverer
  namespace: default
spec:
  cluster:
    name: postgres
  name: fediscoverer
  login: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: fediscoverer-production
  namespace: default
spec:
  cluster:
    name: postgres
  name: fediscoverer_production
  owner: fediscoverer
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: fediscoverer-production-cache
  namespace: default
spec:
  cluster:
    name: postgres
  name: fediscoverer_production_cache
  owner: fediscoverer
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: fediscoverer-production-queue
  namespace: default
spec:
  cluster:
    name: postgres
  name: fediscoverer_production_queue
  owner: fediscoverer

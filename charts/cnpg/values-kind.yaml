cluster:
  instances: 2

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

poolerRW:
  instances: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: mastodon-pooler-rw

poolerRO:
  instances: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: mastodon-pooler-ro
fediscoverer:
  enabled: true
  existingSecret: fediscoverer-pg-creds

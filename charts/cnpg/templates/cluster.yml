{{- with .Values.cluster }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  {{- include "mastodon.podLabels" .podLabels | nindent 2 }}

spec:
  instances: {{ .instances }}
  primaryUpdateStrategy: {{ .primaryUpdateStrategy | default "unsupervised" | quote }}
  primaryUpdateMethod: {{ .primaryUpdateMethod | default "switchover" | quote }}

  {{- with .affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
    {{- include "mastodon.nodeSelector" $.Values.cluster.nodeSelector | nindent 4 }}
    {{- include "mastodon.tolerations" $.Values.cluster.tolerations | nindent 4 }}
  {{- else }}
  {{- if or .nodeSelector .tolerations }}
  affinity:
    {{- include "mastodon.nodeSelector" .nodeSelector | nindent 4 }}
    {{- include "mastodon.tolerations" .tolerations | nindent 4 }}
  {{- end }}
  {{- end }}

  {{- include "mastodon.topologySpreadConstraints" .topologySpreadConstraints | nindent 2 }}

  resources:
    requests:
      cpu: {{ .resources.requests.cpu | quote }}
      memory: {{ .resources.requests.memory | quote }}
    limits:
      cpu: {{ .resources.limits.cpu | quote }}
      memory: {{ .resources.limits.memory | quote }}

  bootstrap:
    initdb:
      database: mastodon
      owner: mastodon
      secret:
        name: {{ .bootstrap.existingSecret | quote }}

  storage:
    size: {{ .storage.size | default "20Gi" | quote }}
    {{ if .storage.storageClass }}
    storageClass: {{ .storage.storageClass | default "" | quote }}
    {{- end }}
    resizeInUseVolumes: {{ .storage.resizeInUseVolumes | default true }}

  postgresql:
    parameters:
      {{- toYaml .postgresql.parameters | nindent 6 }}

  {{- if $.Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: {{ $.Values.backup.wal.enabled | default false }}
      parameters:
        barmanObjectName: {{ .name }}-backup-store
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .monitoring.podMonitor.enabled | default false }}
    {{- if .monitoring.businessMetrics.enabled }}
    customQueriesConfigMap:
      - name: {{ .name }}-business-queries
        key: queries
    {{- end }}

{{- end }}

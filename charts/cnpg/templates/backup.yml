{{- if .Values.backup.enabled }}
{{- with .Values.backup }}

apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $.Values.cluster.name }}-backup-store
  namespace: {{ $.Values.namespace }}
spec:
  retentionPolicy: {{ .retentionPolicy | quote }}

  configuration:
    destinationPath: {{ .destinationPath | quote }}

    {{- if eq .provider "s3" }}
    {{- if .s3.endpointURL }}
    endpointURL: {{ .s3.endpointURL | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ .existingSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .existingSecret }}
        key: ACCESS_SECRET_KEY

    {{- else if eq .provider "azure" }}
    azureCredentials:
      connectionString:
        name: {{ .existingSecret }}
        key: AZURE_CONNECTION_STRING

    {{- else if eq .provider "gcs" }}
    googleCredentials:
      applicationCredentials:
        name: {{ .existingSecret }}
        key: gcsCredentials
    {{- end }}

    wal:
      compression: {{ .wal.compression | quote }}
      maxParallel: {{ .wal.maxParallel }}

    data:
      compression: {{ .data.compression | quote }}

{{- end }}
{{- end }}
---
{{- if .Values.backup.enabled }}

apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.cluster.name }}-scheduled-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self

  cluster:
    name: {{ .Values.cluster.name | quote }}

  method: plugin

  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

{{- end }}

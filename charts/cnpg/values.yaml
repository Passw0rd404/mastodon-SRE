namespace: mastodon

cluster:
  name: mastodon
  instances: 2
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: preferred
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  podLabels: {}

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  storage:
    size: 20Gi
    storageClass: ""
    resizeInUseVolumes: true

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1GB"
      work_mem: "4MB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"

  bootstrap:
    existingSecret: mastodon-pg-app-creds

  monitoring:
    podMonitor:
      enabled: false
    businessMetrics:
      enabled: true

backup:
  enabled: false
  provider: s3 # s3 | azure | gcs
  destinationPath: "s3://your-bucket/mastodon/" # format depends on provider — see comment below
  existingSecret: mastodon-pg-backup-creds
  retentionPolicy: "30d"
  labels: {}
  wal:
    enabled: false
    compression: gzip
    maxParallel: 4
  data:
    compression: gzip
    schedule: "0 0 0 * * *"

  # provider-specific — only the block matching `provider:` above is used
  s3:
    endpointURL: "https://<account-id>.r2.cloudflarestorage.com" # blank for real AWS S3
    # existingSecret keys expected: ACCESS_KEY_ID, ACCESS_SECRET_KEY
  azure:
    # existingSecret key expected: AZURE_CONNECTION_STRING
  gcs:
    # existingSecret key expected: gcsCredentials

poolerRW:
  enabled: true
  instances: 1
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pgbouncer:
    poolMode: transaction
    parameters:
      maxClientConn: 1000
      defaultPoolSize: 50
      reservePoolSize: 10
      reservePoolTimeout: 3
      serverIdleTimeout: 600
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

poolerRO:
  enabled: true
  instances: 1
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pgbouncer:
    poolMode: transaction
    parameters:
      maxClientConn: 500
      defaultPoolSize: 30
      reservePoolSize: 5
      reservePoolTimeout: 3
      serverIdleTimeout: 600
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

fediscoverer:
  enabled: false
  existingSecret: fediscoverer-pg-creds

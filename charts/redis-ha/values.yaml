redis:
  namespace: mastodon
  replicas: 3
  image:
    repository: valkey/valkey
    tag: "8.0.1-alpine"
  auth: true
  authKey: password
  existingSecret: mastodon-redis-app-creds

  exporter:
    enabled: true
    serviceMonitor:
      enabled: true
    extraArgs:
      check-single-keys: "queue:default,queue:push,queue:pull,queue:ingress,queue:mailers,queue:scheduler,schedule,retry,dead"

  sentinel:
    customCommand:
      - valkey-server
    customArgs:
      - /data/conf/sentinel.conf
      - --sentinel
    quorum: 2
    masterGroupName: mastodon-app
    auth: true
    authKey: sentinelPassword
    existingSecret: mastodon-redis-app-creds

  haproxy:
    enabled: true

  persistentVolume:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  hardAntiAffinity: false

  topologySpreadConstraints:
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  redis:
    config:
      maxmemory-policy: noeviction

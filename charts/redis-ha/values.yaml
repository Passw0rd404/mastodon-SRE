redisHA:
  namespace: mastodon
  replicas: 3
  image:
    repository: valkey/valkey
    tag: "8.0.1-alpine"
  auth: true
  existingSecret: mastodon-redis-app-creds # prerequisite secret, key name "auth"

  sentinel:
    customCommand:
      - valkey-server
    customArgs:
      - /data/conf/sentinel.conf
      - --sentinel
    quorum: 2
    masterGroupName: mastodon-app
    auth: true
    existingSecret: mastodon-redis-app-creds

  haproxy:
    enabled: false # Mastodon speaks Sentinel directly

  persistentVolume:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  hardAntiAffinity: false # true forces pods onto separate nodes with no fallback — can fail to schedule on small clusters

  topologySpreadConstraints:
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  exporter:
    enabled: false

  redis:
    config:
      maxmemory-policy: noeviction

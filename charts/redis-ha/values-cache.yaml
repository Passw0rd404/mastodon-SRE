redis:
  existingSecret: mastodon-redis-cache-creds
  authKey: password

  exporter:
    enabled: true
    serviceMonitor:
      enabled: true

  sentinel:
    masterGroupName: mastodon-cache
    auth: true
    authKey: sentinelPassword
    existingSecret: mastodon-redis-cache-creds

  haproxy:
    enabled: true
    hardAntiAffinity: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  persistentVolume:
    enabled: false

  redis:
    config:
      maxmemory-policy: allkeys-lru
      maxmemory: "512mb"

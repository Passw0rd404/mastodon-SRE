redis:
  existingSecret: mastodon-redis-cache-creds
  authKey: password

  sentinel:
    masterGroupName: mastodon-cache
    auth: true
    authKey: sentinelPassword
    existingSecret: mastodon-redis-cache-creds

  haproxy:
    enabled: true

  persistentVolume:
    enabled: false

  redis:
    config:
      maxmemory-policy: allkeys-lru
      maxmemory: "512mb"

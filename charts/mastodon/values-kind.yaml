ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: mastodon.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

elasticsearch:
  enabled: true

  hostname: mastodon-eck-eck-elasticsearch-es-http

  port: 9200
  tls: false

  preset: single_node_cluster

  existingSecret: mastodon-es-creds
  existingSecretKeys:
    username: username
    password: password

mastodon:
  createAdmin:
    enabled: true
    username: admin
    email: a26263842z@gmail.com

  smtp:
    domain: mastodon.local
    fromAddress: notifications@mastodon.local
    server: smtp.ethereal.email
    port: 587
    authMethod: plain
    deliveryMethod: smtp
    enableStartTls: auto
    tls: false
    existingSecret: mastodon-smtp-creds
    existingSecretKeys:
      username: username
      password: password

  secrets:
    existingSecret: mastodon-app-secrets
    existingSecretKeys:
      secretKeyBase: secret-key-base
      vapidPrivateKey: vapid-private-key
      vapidPublicKey: vapid-public-key
      arePrimaryKey: are-primary-key
      areDeterministicKey: are-deterministic-key
      areKeyDerivationSalt: are-derivation-salt

  s3:
    enabled: true
    endpoint: https://1ca37da478719196fd809bc2a62f57b0.r2.cloudflarestorage.com
    hostname: 1ca37da478719196fd809bc2a62f57b0.r2.cloudflarestorage.com
    protocol: https
    region: auto
    bucket: mastodon
    existingSecret: mastodon-s3-creds
    existingSecretKeys:
      accessKeyId: access-key-id
      secretAccessKey: secret-access-key

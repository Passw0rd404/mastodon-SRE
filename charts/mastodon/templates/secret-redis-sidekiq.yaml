{{- if .Values.redis.sidekiq.enabled }}
{{- if not .Values.redis.sidekiq.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mastodon.secrets.redisSidekiqName" . }}
  labels:
    {{- include "mastodon.labels" . | trim | nindent 4 }}
    {{- include "mastodon.userLabels" . | trim | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  password: {{ required "Redis sidekiq password is required with no existing secret" .Values.redis.sidekiq.password | b64enc }}
{{- if eq .Values.redis.mode "sentinel" }}
  sentinel-password: {{ required "Redis sidekiq sentinel password is required when mode is sentinel" .Values.redis.sidekiq.sentinelPassword | b64enc }}
{{- end }}
{{- end }}
{{- end }}

nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

serviceMonitor:
  enabled: true

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3
  scanJobTimeout: 30m
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerScanOnlyCurrentRevisions: true

trivy:
  ignoreUnfixed: true
  timeout: 25m
  resources:
    limits:
      cpu: "1"
      memory: 1Gi

nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

serviceMonitor:
  enabled: true

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3
  scanJobTimeout: 10m
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerScanOnlyCurrentRevisions: true

trivy:
  ignoreUnfixed: true

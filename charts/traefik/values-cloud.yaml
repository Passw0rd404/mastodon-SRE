# values-cloud.yaml
traefik:
  env:
    - name: CF_DNS_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: api-token

  persistence:
    enabled: true
    path: /data
    size: 128Mi

  certificatesResolvers:
    cloudflare-resolver:
      acme:
        email: you@yourdomain.com
        storage: /data/acme.json
        dnsChallenge:
          provider: cloudflare

  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  service:
    type: ClusterIP

  deployment:
    replicas: 1

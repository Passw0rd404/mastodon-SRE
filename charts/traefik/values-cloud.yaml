# values-cloud.yaml
traefik:
  metrics:
    prometheus:
      addRoutersLabels: true
      service:
        enabled: true
      serviceMonitor:
        enabled: true
        honorLabels: true

  env:
    - name: CF_DNS_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: api-token

  persistence:
    enabled: true
    path: /data
    size: 128Mi

  certificatesResolvers:
    cloudflare-resolver:
      acme:
        email: you@yourdomain.com
        storage: /data/acme.json
        dnsChallenge:
          provider: cloudflare

  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  service:
    type: ClusterIP

  deployment:
    replicas: 1

  metrics:
    prometheus:
      service:
        enabled: true
      serviceMonitor:
        enabled: true

  log:
    format: json
    level: INFO
  accessLog:
    enabled: true
    format: json

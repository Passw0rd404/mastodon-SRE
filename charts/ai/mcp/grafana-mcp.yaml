apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: ai
  labels: {app.kubernetes.io/name: grafana-mcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana-mcp}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana-mcp
          image: grafana/mcp-grafana:2.2.0   # verify the tag exists on Docker Hub
          args:
            - -t
            - streamable-http
            - --address
            - 0.0.0.0:8000
            - --allowed-hosts
            - grafana-mcp.ai.svc.cluster.local:8000,grafana-mcp:8000,grafana-mcp.ai:8000,grafana-mcp.ai.svc:8000
            - --disable-write
            - --disable-admin
            - --disable-oncall
            - --disable-asserts
            - --disable-incident
            - --disable-pyroscope
            - --disable-navigation
            - --disable-rendering
            - --disable-snapshot
            - --disable-alerting
            - --max-loki-log-limit
            - "50"
            - --loki-guardrail-mode
            - enforce
            - --loki-guardrail-max-range
            - 6h
            - --prometheus-guardrail-mode
            - enforce
            - --prometheus-guardrail-max-range
            - 24h
            - --usage-stats
            - disabled
          env:
            - name: GRAFANA_URL
              value: http://grafana.monitoring.svc.cluster.local   # TODO confirm
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom: {secretKeyRef: {name: grafana-mcp, key: GRAFANA_SERVICE_ACCOUNT_TOKEN}}
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom: {secretKeyRef: {name: grafana-mcp, key: MCP_GRAFANA_SERVER_TOKEN}}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {tcpSocket: {port: http}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: ai
spec:
  selector: {app.kubernetes.io/name: grafana-mcp}
  ports: [{name: http, port: 8000, targetPort: http}]

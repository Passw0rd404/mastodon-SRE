eck-elasticsearch:
  version: 8.15.0

  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        xpack.watcher.enabled: false
        xpack.graph.enabled: false
        xpack.ml.enabled: false
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            # storageClassName omitted — uses cluster default
      podTemplate:
        metadata:
          labels: {}
          annotations: {}
        spec:
          nodeSelector: {}
          tolerations: []
          affinity: {}
          topologySpreadConstraints: []
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms512m -Xmx512m"
              resources:
                requests:
                  cpu: "250m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "1.5Gi"
